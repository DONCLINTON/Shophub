name: Refresh ShopHub sitemap and rental SEO pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: shophub-seo-refresh
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate sitemap and crawlable rental pages
        run: node scripts/generate-sitemap.mjs
      - name: Commit updated SEO files
        run: |
          git add sitemap.xml rentals/
          if git diff --cached --quiet; then
            echo "SEO files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh ShopHub listing SEO pages and sitemap"
          git push
